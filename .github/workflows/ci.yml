name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Template and example fixtures pass
        run: node bin/validate-asset.mjs templates/asset-repo test/fixtures/valid/*
      - name: Broken fixture fails
        run: "! node bin/validate-asset.mjs test/fixtures/invalid/example-broken-asset"
